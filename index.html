<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>COTM 3101: Theory of Structures — Complete Mastery Lab</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#030712" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- TOP HUD BAR -->
  <header class="hud-header">
    <div class="brand">
      <span class="brand-icon">🏗️</span>
      <div>
        <h1>COTM 3101: Theory of Structures Mastery Lab</h1>
        <p>Interactive Engineering Workbench • AAU EiABC Curriculum • 100% Offline</p>
      </div>
    </div>
    
    <!-- Primary View Switcher (Desktop & Tablet) -->
    <nav class="top-nav-bar">
      <button class="top-nav-btn active" data-view="module" onclick="switchAppView('module')">📚 Curriculum</button>
      <button class="top-nav-btn" data-view="solvers" onclick="switchAppView('solvers')">🧮 Solvers</button>
      <button class="top-nav-btn" data-view="atlas" onclick="switchAppView('atlas')">📜 Formula Atlas</button>
      <button class="top-nav-btn" data-view="exam" onclick="switchAppView('exam')">⏱️ Exam Sim</button>
      <button class="top-nav-btn" data-view="errors" onclick="switchAppView('errors')">📓 Error Notebook</button>
    </nav>

    <div class="hud-stats">
      <div class="stat-pill" id="rankBadge">🎖️ Apprentice</div>
      <div class="stat-pill" id="xpBadge">⚡ 0 XP</div>
      <div class="stat-pill" id="streakBadge">🔥 Streak: 0</div>
      <div class="stat-pill" id="masteryBadge">📊 0% Mastered</div>
      <button class="hud-btn" onclick="exportStandaloneHTML()" title="Download single standalone HTML file for phone or offline PC">📲 Save Offline App</button>
      <button class="hud-btn reset-btn" onclick="resetProgress()" title="Reset Saved Progress">↺ Reset</button>
    </div>
  </header>

  <div class="workspace">
    <!-- LEFT SIDEBAR: 7 CHAPTER MODULES + LIVE STRUCTURAL SOLVERS -->
    <aside class="sidebar">
      <div class="sidebar-section-title">📚 COURSE MODULES (PDF 1–7)</div>
      <nav id="moduleList" class="module-nav"></nav>

      <div class="sidebar-section-title" style="margin-top:24px;">🧮 LIVE ENGINEERING SANDBOXES</div>
      <div class="module-nav">
        <button class="nav-item tool-btn" onclick="openSandbox('determinacy')">
          <span>🔍 Stability & Determinacy</span>
        </button>
        <button class="nav-item tool-btn" onclick="openSandbox('threemoment')">
          <span>📐 2-Span Clapeyron Solver</span>
        </button>
        <button class="nav-item tool-btn" onclick="openSandbox('hardycross')">
          <span>🔄 Hardy Cross Live Engine</span>
        </button>
        <button class="nav-item tool-btn" onclick="openSandbox('conjugate')">
          <span>🌉 Conjugate Beam Viewer</span>
        </button>
      </div>

      <div class="sidebar-section-title" style="margin-top:24px;">🎓 ACTIVE RECALL & DRILLS</div>
      <div class="module-nav">
        <button class="nav-item" onclick="switchAppView('atlas')">
          <span>🃏 Formula Flashcard Deck</span>
        </button>
        <button class="nav-item" onclick="switchAppView('exam')">
          <span>⏱️ Midterm Diagnostic Sim</span>
        </button>
        <button class="nav-item" onclick="switchAppView('errors')">
          <span>📓 Personal Error Vault</span>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="main-panel">
      <!-- MODULE SUB-MODE TABS -->
      <div class="mode-tabs" id="modeTabs">
        <button class="mode-tab active" data-tab="theory" onclick="switchModuleTab('theory')">
          📖 1. Deep Theory & Intuition
        </button>
        <button class="mode-tab" data-tab="guided" onclick="switchModuleTab('guided')">
          🔬 2. Guided Worked Examples
        </button>
        <button class="mode-tab" data-tab="shortcuts" onclick="switchModuleTab('shortcuts')">
          ⚡ 3. Ninja Tricks & Method Guide
        </button>
        <button class="mode-tab" data-tab="arena" onclick="switchModuleTab('arena')">
          ⚔️ 4. Challenge Gauntlet (+XP)
        </button>
        <button class="mode-tab" data-tab="cheatsheet" onclick="switchModuleTab('cheatsheet')">
          📜 5. Chapter Formula Vault
        </button>
      </div>

      <!-- DYNAMIC VIEWPORT -->
      <div id="viewport" class="viewport"></div>
    </main>
  </div>

  <!-- MOBILE-FIRST BOTTOM NAVIGATION BAR -->
  <nav class="bottom-mobile-nav">
    <button class="mob-nav-btn active" data-view="module" onclick="switchAppView('module')">
      <span class="mob-icon">📚</span>
      <span>Modules</span>
    </button>
    <button class="mob-nav-btn" data-view="solvers" onclick="switchAppView('solvers')">
      <span class="mob-icon">🧮</span>
      <span>Solvers</span>
    </button>
    <button class="mob-nav-btn" data-view="atlas" onclick="switchAppView('atlas')">
      <span class="mob-icon">📜</span>
      <span>Atlas</span>
    </button>
    <button class="mob-nav-btn" data-view="exam" onclick="switchAppView('exam')">
      <span class="mob-icon">⏱️</span>
      <span>Exam</span>
    </button>
    <button class="mob-nav-btn" data-view="errors" onclick="switchAppView('errors')">
      <span class="mob-icon">📓</span>
      <span>Errors</span>
    </button>
  </nav>

  <!-- Script Architecture -->
  <script src="visuals.js"></script>
  <script src="solvers.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
