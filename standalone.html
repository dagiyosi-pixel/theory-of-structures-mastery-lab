  <script>
// COTM 3101: Theory of Structures - Interactive SVG Engineering Visualization Engine
// Provides high-contrast, responsive SVG diagrams for beams, trusses, frames, and diagrams.

const StructureVisuals = {
  // Helper to generate SVG container
  createSvg: function(width, height, content, viewBox) {
    const vb = viewBox || `0 0 ${width} ${height}`;
    return `<svg class="eng-svg" viewBox="${vb}" width="100%" height="${height}" xmlns="http://www.w3.org/2000/svg">${content}</svg>`;
  },

  // =========================================================================
  // 1. BEAM WITH SUPPORTS, LOADS, ELASTIC CURVE & DIAGRAMS
  // =========================================================================
  renderBeam: function(config) {
    const w = config.width || 680;
    const h = config.height || 220;
    const padX = 60;
    const padY = 110;
    const beamY = padY;
    const beamLen = w - 2 * padX;
    const L = config.length || 10; // real meters

    function toScreenX(xMeters) {
      return padX + (xMeters / L) * beamLen;
    }

    let svg = `
      <defs>
        <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="8" stroke="#334155" stroke-width="1.5" />
        </pattern>
        <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 0 L 5 10 z" fill="#facc15" />
        </marker>
        <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 10 L 10 10 L 5 0 z" fill="#22c55e" />
        </marker>
      </defs>
    `;

    // 1. Grid/Background details
    svg += `<rect x="0" y="0" width="${w}" height="${h}" fill="#070c18" rx="8" />`;

    // 2. Beam Member
    svg += `<line x1="${padX}" y1="${beamY}" x2="${padX + beamLen}" y2="${beamY}" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />`;

    // 3. Supports
    if (config.supports) {
      config.supports.forEach(sup => {
        const sx = toScreenX(sup.x);
        const sy = beamY;
        if (sup.type === 'pin') {
          // Triangle pin
          svg += `
            <polygon points="${sx},${sy} ${sx - 12},${sy + 20} ${sx + 12},${sy + 20}" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
            <line x1="${sx - 16}" y1="${sy + 20}" x2="${sx + 16}" y2="${sy + 20}" stroke="#94a3b8" stroke-width="2" />
            <rect x="${sx - 16}" y="${sy + 20}" width="32" height="6" fill="url(#hatch)" />
            <text x="${sx}" y="${sy + 36}" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">${sup.label || 'Pin'}</text>
          `;
        } else if (sup.type === 'roller') {
          // Roller support with 2 circles
          svg += `
            <polygon points="${sx},${sy} ${sx - 10},${sy + 14} ${sx + 10},${sy + 14}" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
            <circle cx="${sx - 5}" cy="${sy + 18}" r="3.5" fill="#38bdf8" />

          svg += `<line x1="${p.x - 12}" y1="${p.y + 20}" x2="${p.x + 12}" y2="${p.y + 20}" stroke="#94a3b8" stroke-width="1.5" />`;

    // Draw loads

    return this.createSvg(w, h, svg);

  // =========================================================================
  // 4. MOMENT & SHEAR DIAGRAMS VISUALIZER (BMD & SFD)
  // =========================================================================
  renderDiagramCurve: function(type, points, width, height, title) {
    const w = width || 640;
    const h = height || 160;
    const padX = 60;
    const baselineY = h / 2;
    const spanW = w - 2 * padX;

    let svg = `<rect x="0" y="0" width="${w}" height="${h}" fill="#070c18" rx="8" />`;
    svg += `<line x1="${padX}" y1="${baselineY}" x2="${padX + spanW}" y2="${baselineY}" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />`;
    svg += `<text x="14" y="24" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="bold">${title || (type === 'bmd' ? 'BENDING MOMENT DIAGRAM (kNÂ·m)' : 'SHEAR FORCE DIAGRAM (kN)')}</text>`;

    if (points && points.length > 1) {
      let pathD = `M ${padX + points[0].x * spanW} ${baselineY - points[0].y}`;
      for (let i = 1; i < points.length; i++) {
        const px = padX + points[i].x * spanW;
        const py = baselineY - points[i].y;
        if (points[i].control) {
          const cx = padX + points[i].control.x * spanW;
          const cy = baselineY - points[i].control.y;
          pathD += ` Q ${cx} ${cy} ${px} ${py}`;
        } else {
          pathD += ` L ${px} ${py}`;
        }
      }

      const color = type === 'bmd' ? '#f43f5e' : '#22c55e';
      const fillArea = `${pathD} L ${padX + spanW} ${baselineY} L ${padX} ${baselineY} Z`;
      svg += `<path d="${fillArea}" fill="${type === 'bmd' ? 'rgba(244, 63, 94, 0.12)' : 'rgba(34, 197, 94, 0.12)'}" />`;
      svg += `<path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5" />`;

      // Value callouts
      points.forEach(pt => {
        if (pt.label) {
          const lx = padX + pt.x * spanW;
          const ly = baselineY - pt.y + (pt.y >= 0 ? -8 : 16);
          svg += `<text x="${lx}" y="${ly}" fill="${color}" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">${pt.label}</text>`;
        }
      });
    }

    return this.createSvg(w, h, svg);
  }
};

  <script>
// COTM 3101: Theory of Structures - Interactive Structural Solvers & Visualizers
// Integrates real-time static calculations with dynamic SVG diagrams.

const StructureSolvers = {
  // =========================================================================
  // 1. DETERMINACY & STABILITY ENGINE
  // =========================================================================
  analyzeDeterminacy: function(type, inputs) {
    if (type === 'beam') {
      const r = parseInt(inputs.reactions) || 0;
      const s = parseInt(inputs.internalHinges) || 0;
      const parallel = inputs.parallelReactions || false;
      const concurrent = inputs.concurrentReactions || false;

      let stable = true;
      let notes = [];

      if (parallel) {
        stable = false;
        notes.push("CRITICAL TRAP: All reaction forces are parallel (e.g., all vertical rollers)! The beam cannot resist lateral loads (Î£Fx = 0 unsatisfied).");
      }
      if (concurrent) {
        stable = false;
        notes.push("CRITICAL TRAP: All reaction lines intersect at a single point! The structure has zero rotational resistance about this point.");
      }

      const eqCount = 3 + s;
      const d = r - eqCount;

      let status = "";
      if (r < 3) {
        stable = false;
        status = "Externally Unstable (r < 3)";
        notes.push("Fewer than 3 external restraints in 2D space.");
      } else if (!stable) {
        status = "Geometrically Unstable Mechanism";
      } else if (d === 0) {
        status = "Statically Determinate & Stable";
        notes.push("Available reactions exactly match equations (r = 3 + s). All reactions and internal forces can be solved by statics.");
      } else if (d > 0) {
        status = `Statically Indeterminate to Degree ${d}`;
        notes.push(`Requires ${d} additional compatibility equations (Force Method, Three-Moment, or Displacement Method).`);
      } else {
        stable = false;
        status = "Unstable Kinematic Mechanism";
        notes.push("Internal releases exceed reactions, creating an internal folding mechanism.");
      }

      // Generate visual SVG representation
      let supports = [];
      if (r >= 3 && !parallel) {
        supports = [{ x: 0, type: 'pin', label: 'Pin (r=2)' }, { x: 8, type: 'roller', label: 'Roller (r=1)' }];
      } else if (parallel) {
        supports = [{ x: 1, type: 'roller', label: 'Roller 1' }, { x: 4, type: 'roller', label: 'Roller 2' }, { x: 7, type: 'roller', label: 'Roller 3' }];
      }
      if (s > 0) {
        supports.push({ x: 4, type: 'hinge', label: `Hinge (s=${s})` });
      }

      const svgHtml = StructureVisuals.renderBeam({
        width: 620,
        height: 180,
        length: 8,
        supports: supports,
        loads: [{ x: 4, type: 'point', val: 'Arbitrary Load P' }]
      });

      return {
        type: 'Continuous Beam',
        formula: `D = r - (3 + s) = ${r} - (3 + ${s}) = ${d}`,
        degree: d,
        status: status,
        isStable: stable,
        notes: notes,
        svg: svgHtml
      };
    }

    if (type === 'truss') {
      const j = parseInt(inputs.joints) || 0;
      const m = parseInt(inputs.members) || 0;
      const r = parseInt(inputs.reactions) || 0;
      const hasUnbracedPanel = inputs.unbracedPanel || false;

      const r_m = 3;
      const d_ext = r - r_m;
      const d_int = (m + r_m) - (2 * j);
      const d_total = (m + r) - (2 * j);

      let stable = true;
      let notes = [];

      if (r < 3) {
        stable = false;
        notes.push("External reactions r < 3 â†’ Externally unstable.");
      }
      if (hasUnbracedPanel) {
        stable = false;
        notes.push("CRITICAL TRAP: An unbraced rectangular panel lacks diagonal bars! Even if m + r = 2j, that panel collapses in shear (Internally Unstable Mechanism).");
      }

      let status = "";
      if (!stable) {
        status = "Unstable Mechanism";
      } else if (d_total === 0) {
        status = "Statically Determinate & Stable";
        notes.push("All 2j joint equations are satisfied by the available members and reactions.");
      } else if (d_total > 0) {
        status = `Statically Indeterminate (Overall D = ${d_total})`;
        notes.push(`External Indeterminacy D_e = ${d_ext >= 0 ? d_ext : 0}, Internal Indeterminacy D_i = ${d_int}.`);
      } else {
        status = "Internally Unstable (Lacks sufficient members)";
        stable = false;
      }

      const svgHtml = StructureVisuals.renderTruss({
        width: 620,
        height: 180,
        scale: 65,
        nodes: { A: [0, 0], B: [1.6, 0], C: [3.2, 0], D: [4.8, 0], E: [0.8, 1.2], F: [2.4, 1.2], G: [4.0, 1.2] },
        members: [
          ['A', 'B'], ['B', 'C'], ['C', 'D'],
          ['E', 'F'], ['F', 'G'],
          ['A', 'E'], ['B', 'E'], ['B', 'F'], ['C', 'F'], ['C', 'G'], ['D', 'G'],
          ['E', 'B'], ['F', 'C']
        ],
        supports: [{ node: 'A', type: 'pin' }, { node: 'D', type: 'roller' }],
        loads: [{ node: 'F', val: 'P' }]
      });

      return {
        type: 'Plane Truss',
        formula: `Overall: D = (m + r) - 2j = (${m} + ${r}) - 2(${j}) = ${d_total}\nExternal: D_e = r - 3 = ${r} - 3 = ${d_ext}\nInternal: D_i = (m + 3) - 2j = (${m} + 3) - 2(${j}) = ${d_int}`,
        degree: d_total,
        status: status,
        isStable: stable,
        notes: notes,
        svg: svgHtml
      };
    }

    if (type === 'frame') {
      const j = parseInt(inputs.joints) || 0;
      const m = parseInt(inputs.members) || 0;
      const r = parseInt(inputs.reactions) || 0;
      const s = parseInt(inputs.specialConditions) || 0;
      const loops = parseInt(inputs.closedLoops) || 0;

      const totalUnknowns = 3 * m + r;
      const totalEqs = 3 * j + s;
      const d_total = totalUnknowns - totalEqs;
      const d_loops = 3 * loops - s;

      let stable = r >= 3;
      let notes = [];
      let status = "";

      if (d_total === 0 && stable) {
        status = "Statically Determinate & Stable";
      } else if (d_total > 0 && stable) {
        status = `Statically Indeterminate to Degree ${d_total}`;
        notes.push(`Closed-Loop Formula Check: D_i = 3(closed loops) - s = 3(${loops}) - ${s} = ${d_loops}`);
      } else {
        status = "Unstable Frame Mechanism";
        stable = false;
      }

      return {
        type: 'Rigid Frame',
        formula: `D = (3m + r) - (3j + s) = [3(${m}) + ${r}] - [3(${j}) + ${s}] = ${totalUnknowns} - ${totalEqs} = ${d_total}`,
        degree: d_total,
        status: status,
        isStable: stable,
        notes: notes
      };
    }
  },

  // =========================================================================
  // 2. TWO-SPAN THREE-MOMENT EQUATION ENGINE WITH SFD/BMD CURVES
  // =========================================================================
  solveThreeMoment: function(params) {
    const L1 = parseFloat(params.L1) || 4.0;
    const L2 = parseFloat(params.L2) || 6.0;
    const I1 = parseFloat(params.I1) || 1.0;
    const I2 = parseFloat(params.I2) || 1.0;

    const span1Type = params.span1LoadType; // 'udl' or 'point'
    const span2Type = params.span2LoadType; // 'udl' or 'point'

    const w1 = parseFloat(params.w1) || 0;
    const P1 = parseFloat(params.P1) || 0;
    const a1 = parseFloat(params.a1) || (L1 / 2);
    const b1 = L1 - a1;

    const w2 = parseFloat(params.w2) || 0;
    const P2 = parseFloat(params.P2) || 0;
    const a2 = parseFloat(params.a2) || (L2 / 2); // distance from C
    const b2 = L2 - a2;

    // Load terms: (6*A*x / L)
    let term1 = 0;
    if (span1Type === 'udl') {
      term1 = (w1 * Math.pow(L1, 3)) / 4;
    } else if (span1Type === 'point') {
      term1 = (P1 * a1 * (Math.pow(L1, 2) - Math.pow(a1, 2))) / L1;
    }

    let term2 = 0;
    if (span2Type === 'udl') {
      term2 = (w2 * Math.pow(L2, 3)) / 4;
    } else if (span2Type === 'point') {
      term2 = (P2 * a2 * (Math.pow(L2, 2) - Math.pow(a2, 2))) / L2;
    }

    const coeff_MB = 2 * ((L1 / I1) + (L2 / I2));
    const RHS = -((term1 / I1) + (term2 / I2));
    const M_B = RHS / coeff_MB;

    // Reactions by isolating spans
    let R_A = 0;
    if (span1Type === 'udl') {
      R_A = (w1 * L1 / 2) + (M_B / L1);
    } else if (span1Type === 'point') {
      R_A = (P1 * b1 / L1) + (M_B / L1);
    }

    let R_C = 0;
    if (span2Type === 'udl') {
      R_C = (w2 * L2 / 2) + (M_B / L2);
    } else if (span2Type === 'point') {
      R_C = (P2 * b2 / L2) + (M_B / L2);
    }

    let totalLoad = 0;
    if (span1Type === 'udl') totalLoad += w1 * L1; else totalLoad += P1;
    if (span2Type === 'udl') totalLoad += w2 * L2; else totalLoad += P2;

    const R_B = totalLoad - R_A - R_C;

    // Max Sagging Moments
    let maxSag1 = 0;
    if (span1Type === 'udl') {
      maxSag1 = (w1 * Math.pow(L1, 2) / 8) + (M_B / 2);
    } else {
      maxSag1 = (P1 * a1 * b1 / L1) + (M_B * a1 / L1);
    }

    let maxSag2 = 0;
    if (span2Type === 'udl') {
      maxSag2 = (w2 * Math.pow(L2, 2) / 8) + (M_B / 2);
    } else {
      maxSag2 = (P2 * a2 * b2 / L2) + (M_B * (L2 - a2) / L2);
    }

    // Dynamic Beam SVG
    const totalL = L1 + L2;
    const beamSvg = StructureVisuals.renderBeam({
      width: 640,
      height: 190,
      length: totalL,
      supports: [
        { x: 0, type: 'pin', label: `A (R=${R_A.toFixed(1)}kN)` },
        { x: L1, type: 'roller', label: `B (R=${R_B.toFixed(1)}kN)` },
        { x: totalL, type: 'roller', label: `C (R=${R_C.toFixed(1)}kN)` }
      ],
      loads: [
        span1Type === 'udl' ? { start: 0, end: L1, type: 'udl', val: `${w1} kN/m` } : { x: a1, type: 'point', val: `${P1} kN` },
        span2Type === 'udl' ? { start: L1, end: totalL, type: 'udl', val: `${w2} kN/m` } : { x: L1 + (L2 - a2), type: 'point', val: `${P2} kN` }
      ],
      showDeflection: true,
      sagAmount: 22
    });

    // Dynamic BMD Curve
    const fracB = L1 / totalL;
    const bmdPoints = [

  // =========================================================================
  // 3. HARDY CROSS LIVE ITERATIVE MOMENT DISTRIBUTION ENGINE
  // =========================================================================
  solveHardyCross2Span: function(params) {
    const L1 = parseFloat(params.L1) || 3.6;
    const L2 = parseFloat(params.L2) || 4.0;
    const I1 = parseFloat(params.I1) || 3.6;
    const I2 = parseFloat(params.I2) || 3.6;

    const endA = params.endA || 'fixed';
    const endC = params.endC || 'hinged';

    let K_BA = I1 / L1;
    if (endA === 'hinged') K_BA = 0.75 * (I1 / L1);

    let K_BC = I2 / L2;
    if (endC === 'hinged') K_BC = 0.75 * (I2 / L2);

    const sumK_B = K_BA + K_BC;
    const DF_BA = K_BA / sumK_B;
    const DF_BC = K_BC / sumK_B;

    const DF_AB = endA === 'fixed' ? 0.0 : 1.0;
    const DF_CB = endC === 'fixed' ? 0.0 : 1.0;

    let FEM_AB = parseFloat(params.FEM_AB) || -30.0;
    let FEM_BA = parseFloat(params.FEM_BA) || +30.0;
    let FEM_BC = parseFloat(params.FEM_BC) || -22.5;
    let FEM_CB = parseFloat(params.FEM_CB) || +22.5;

    if (endC === 'hinged' && params.useModifiedStiffness) {
      const releaseC = -FEM_CB;
      FEM_BC = FEM_BC + 0.5 * releaseC;
      FEM_CB = 0.0;
    }

    const rows = [];
    rows.push({
      step: 'Distribution Factors (DF)',
      AB: DF_AB.toFixed(3),
      BA: DF_BA.toFixed(3),
      BC: DF_BC.toFixed(3),
      CB: DF_CB.toFixed(3)
    });

    rows.push({
      step: 'Initial Fixed End Moments (FEM)',
      AB: FEM_AB.toFixed(2),
      BA: FEM_BA.toFixed(2),
      BC: FEM_BC.toFixed(2),
      CB: FEM_CB.toFixed(2)
    });

    let cur_AB = FEM_AB;
    let cur_BA = FEM_BA;
    let cur_BC = FEM_BC;
    let cur_CB = FEM_CB;

    // Cycle 1: Balance
    const unbal_B1 = cur_BA + cur_BC;
    const bal_BA1 = -unbal_B1 * DF_BA;
    const bal_BC1 = -unbal_B1 * DF_BC;

    let bal_AB1 = 0;
    let bal_CB1 = 0;
    if (endA === 'hinged') bal_AB1 = -cur_AB * DF_AB;
    if (endC === 'hinged' && !params.useModifiedStiffness) bal_CB1 = -cur_CB * DF_CB;

    rows.push({
      step: 'Cycle 1: Balance Joint B',
      AB: bal_AB1.toFixed(2),
      BA: bal_BA1.toFixed(2),
      BC: bal_BC1.toFixed(2),
      CB: bal_CB1.toFixed(2)
    });

    cur_AB += bal_AB1;
    cur_BA += bal_BA1;
    cur_BC += bal_BC1;
    cur_CB += bal_CB1;

    // Cycle 1: Carry-Over
    const co_AB1 = (endA === 'fixed') ? 0.5 * bal_BA1 : 0;
    const co_BA1 = (endA === 'hinged') ? 0.5 * bal_AB1 : 0;
    const co_CB1 = (endC === 'fixed') ? 0.5 * bal_BC1 : 0;
    const co_BC1 = (endC === 'hinged' && !params.useModifiedStiffness) ? 0.5 * bal_CB1 : 0;

    rows.push({
      step: 'Cycle 1: Carry-Over (COF = +0.5)',
      AB: co_AB1.toFixed(2),
      BA: co_BA1.toFixed(2),
      BC: co_BC1.toFixed(2),
      CB: co_CB1.toFixed(2)
    });

    cur_AB += co_AB1;
    cur_BA += co_BA1;
    cur_BC += co_BC1;
    cur_CB += co_CB1;

    // Cycle 2: Balance
    const unbal_B2 = co_BA1 + co_BC1;
    const bal_BA2 = -unbal_B2 * DF_BA;
    const bal_BC2 = -unbal_B2 * DF_BC;

    rows.push({
      step: 'Cycle 2: Balance Joint B',
      AB: '0.00',
      BA: bal_BA2.toFixed(2),
      BC: bal_BC2.toFixed(2),
      CB: '0.00'
    });

    cur_BA += bal_BA2;
    cur_BC += bal_BC2;

    const co_AB2 = (endA === 'fixed') ? 0.5 * bal_BA2 : 0;
    rows.push({
      step: 'Cycle 2: Carry-Over',
      AB: co_AB2.toFixed(2),
      BA: '0.00',
      BC: '0.00',
      CB: (endC === 'fixed') ? (0.5 * bal_BC2).toFixed(2) : '0.00'
    });
    cur_AB += co_AB2;

    rows.push({
      step: 'FINAL EQUILIBRIUM MOMENTS (Î£M)',
      AB: cur_AB.toFixed(2),
      BA: cur_BA.toFixed(2),
      BC: cur_BC.toFixed(2),
      CB: cur_CB.toFixed(2),
      isFinal: true
    });

    return {
      K_BA: K_BA.toFixed(3),
      K_BC: K_BC.toFixed(3),
      DF_BA: DF_BA.toFixed(3),
      DF_BC: DF_BC.toFixed(3),
      rows: rows
    };
  },

function startExamTimer() {
  if (examTimer) return;
  examTimer = setInterval(() => {
    if (examTimeSeconds > 0) {
      examTimeSeconds--;
      const badge = document.getElementById('examTimerBadge');
      if (badge) {
        badge.innerText = `â³ Time Left: ${Math.floor(examTimeSeconds / 60)}:${(examTimeSeconds % 60).toString().padStart(2, '0')}`;
      }
    } else {
      clearInterval(examTimer);
      examTimer = null;
      submitExamEarly();
    }
  }, 1000);
}

function selectExamAnswer(qIdx, optIdx) {
  examAnswers[qIdx] = optIdx;
  renderMainView();
}

function nextExamQuestion() {
  if (examCurrentIdx < EXAM_SIMULATOR_QUESTIONS.length - 1) {
    examCurrentIdx++;
    renderMainView();
  } else {
    submitExamEarly();
  }
}

function prevExamQuestion() {
  if (examCurrentIdx > 0) {
    examCurrentIdx--;
    renderMainView();
  }
}

function submitExamEarly() {
  if (examTimer) {
    clearInterval(examTimer);
    examTimer = null;
  }
  examFinished = true;

  // Log missed questions into userState.errors
  EXAM_SIMULATOR_QUESTIONS.forEach((q, idx) => {
    const chosen = examAnswers[idx];
    const isCorrect = chosen !== undefined && q.options[chosen].correct;
    if (!isCorrect) {
      const errKey = `exam_${q.id}`;
      if (!userState.errors.some(e => e.key === errKey)) {
        userState.errors.push({
          key: errKey,
          title: q.title,
          prompt: q.prompt,
          modTitle: q.module,
          mistake: chosen !== undefined ? q.options[chosen].text : 'Unanswered',
          correction: q.options.find(o => o.correct).explain
        });
      }
    }
  });

  saveState();
  renderMainView();
}

function restartExam() {
  examFinished = false;
  examCurrentIdx = 0;
  examAnswers = {};
  examTimeSeconds = 600;
  startExamTimer();
  renderMainView();
}

      <button class="btn-primary" onclick="runHardyCrossSolve()">Generate Iterative Distribution Table</button>
      <div id="hcResultBox" style="margin-top:20px; display:none;"></div>
    `;
    runHardyCrossSolve();
  } else if (currentSolver === 'conjugate') {
    container.innerHTML = `
      <div class="calc-grid">
        <div class="input-group" style="grid-column:1/-1;">
          <label>Select Real Beam Boundary Configuration</label>
          <select id="conjSelect" onchange="runConjugateTransform()" style="font-size:1rem; padding:12px;">
            <option value="cantilever">Cantilever Beam (Fixed at A, Free Tip at B)</option>
            <option value="propped">Propped Cantilever (Fixed at A, Roller at B)</option>
            <option value="overhang">Overhanging Beam (Pin A, Roller B, Free Tip C)</option>
          </select>
        </div>
      </div>
      <div id="conjResultBox" style="margin-top:16px;"></div>
    `;
    runConjugateTransform();
  }
}

function updateDetInputs() {
  const type = document.getElementById('detType').value;
  const container = document.getElementById('detDynamicInputs');
  if (type === 'beam') {
    container.innerHTML = `
      <div class="input-group"><label>Reaction Components (r)</label><input type="number" id="det_r" value="5" min="1" /></div>
      <div class="input-group"><label>Internal Hinges (s)</label><input type="number" id="det_s" value="1" min="0" /></div>
      <div class="input-group"><label>All reactions parallel?</label><select id="det_parallel"><option value="false">No (Stable)</option><option value="true">Yes (Unstable Trap!)</option></select></div>
    `;
  } else if (type === 'truss') {
    container.innerHTML = `
      <div class="input-group"><label>Pin Joints (j)</label><input type="number" id="det_j" value="8" min="3" /></div>
      <div class="input-group"><label>Members (m)</label><input type="number" id="det_m" value="13" min="3" /></div>
      <div class="input-group"><label>Reaction Components (r)</label><input type="number" id="det_r" value="3" min="3" /></div>
      <div class="input-group"><label>Unbraced square panels?</label><select id="det_unbraced"><option value="false">No (Triangulated)</option><option value="true">Yes (Shear Collapse!)</option></select></div>
    `;
  } else if (type === 'frame') {
    container.innerHTML = `
      <div class="input-group"><label>Rigid Joints (j)</label><input type="number" id="det_j" value="9" min="2" /></div>
      <div class="input-group"><label>Members (m)</label><input type="number" id="det_m" value="10" min="1" /></div>
      <div class="input-group"><label>Reaction Components (r)</label><input type="number" id="det_r" value="9" min="3" /></div>
      <div class="input-group"><label>Special Releases (s)</label><input type="number" id="det_s" value="0" min="0" /></div>
      <div class="input-group"><label>Closed Cells (n)</label><input type="number" id="det_loops" value="4" min="0" /></div>
    `;
  }
}

function runDeterminacySolve() {
  const type = document.getElementById('detType').value;
  let inputs = {};
  if (type === 'beam') {
    inputs = {
      reactions: document.getElementById('det_r').value,
      internalHinges: document.getElementById('det_s').value,
      parallelReactions: document.getElementById('det_parallel').value === 'true'
    };
  } else if (type === 'truss') {
    inputs = {
      joints: document.getElementById('det_j').value,
      members: document.getElementById('det_m').value,
      reactions: document.getElementById('det_r').value,
      unbracedPanel: document.getElementById('det_unbraced').value === 'true'
    };
  } else if (type === 'frame') {
    inputs = {
      joints: document.getElementById('det_j').value,
      members: document.getElementById('det_m').value,
      reactions: document.getElementById('det_r').value,
      specialConditions: document.getElementById('det_s').value,
      closedLoops: document.getElementById('det_loops').value
    };
  }

  const res = StructureSolvers.analyzeDeterminacy(type, inputs);
  const box = document.getElementById('detResultBox');
  box.style.display = 'block';

  box.innerHTML = `
    <div class="step-box" style="border-color:${res.isStable ? 'var(--accent)' : 'var(--danger)'}">
      <h3 style="color:${res.isStable ? 'var(--accent)' : 'var(--danger)'}; margin-top:0;">Verdict: ${res.status}</h3>
      <div class="formula-banner">${res.formula}</div>
      ${res.svg ? `<div style="margin:14px 0;">${res.svg}</div>` : ''}
      <ul style="padding-left:20px; margin-top:10px;">
        ${res.notes.map(n => `<li style="margin-bottom:6px;">${n}</li>`).join('')}
      </ul>
    </div>
  `;
}

function runThreeMomentSolve() {
  const params = {
    L1: document.getElementById('tm_L1').value,
    L2: document.getElementById('tm_L2').value,
    span1LoadType: document.getElementById('tm_loadType1').value,
    span2LoadType: document.getElementById('tm_loadType2').value,
    w1: document.getElementById('tm_mag1').value,
    P1: document.getElementById('tm_mag1').value,
    a1: document.getElementById('tm_a1').value,
    w2: document.getElementById('tm_mag2').value,
    P2: document.getElementById('tm_mag2').value,
    a2: document.getElementById('tm_a2').value
  };

  const res = StructureSolvers.solveThreeMoment(params);
  const box = document.getElementById('tmResultBox');
  box.style.display = 'block';

  box.innerHTML = `
    <div class="step-box">
      <h3 style="color:var(--gold); margin-top:0;">Clapeyron Solution Results & Bending Diagrams:</h3>
      ${res.beamSvg}
      <p style="margin-top:14px;"><strong>Load Terms:</strong> Span 1 (6Aâ‚xâ‚/Lâ‚) = <code>${res.term1} kNÂ·mÂ²</code> | Span 2 (6Aâ‚‚xâ‚‚/Lâ‚‚) = <code>${res.term2} kNÂ·mÂ²</code></p>
      <div class="formula-banner">Three-Moment Equation: ${res.coeff_MB} Â· M_B = ${res.RHS}  âž”  M_B = ${res.M_B} kNÂ·m</div>
      
      <div class="calc-grid" style="margin-top:16px;">
        <div class="stat-pill" style="text-align:center;">Support Moment M_B: <strong>${res.M_B} kNÂ·m</strong></div>
        <div class="stat-pill" style="text-align:center;">Reaction R_A: <strong>${res.R_A} kN</strong></div>
        <div class="stat-pill" style="text-align:center;">Reaction R_B: <strong>${res.R_B} kN</strong></div>
        <div class="stat-pill" style="text-align:center;">Reaction R_C: <strong>${res.R_C} kN</strong></div>
      </div>

      <div style="margin-top:16px;">
        ${res.bmdSvg}
      </div>
    </div>
  `;
}

function runHardyCrossSolve() {
  const params = {
    L1: document.getElementById('hc_L1').value,
    L2: document.getElementById('hc_L2').value,
    endA: document.getElementById('hc_endA').value,
    endC: document.getElementById('hc_endC').value,
    FEM_AB: document.getElementById('hc_femAB').value,
    FEM_BA: document.getElementById('hc_femBA').value,
    FEM_BC: document.getElementById('hc_femBC').value,
    FEM_CB: document.getElementById('hc_femCB').value,
    useModifiedStiffness: true
  };

  const res = StructureSolvers.solveHardyCross2Span(params);
  const box = document.getElementById('hcResultBox');
  box.style.display = 'block';

  box.innerHTML = `
    <div class="step-box">
      <h3 style="color:var(--gold); margin-top:0;">Hardy Cross Distribution Summary:</h3>
      <p>Stiffness K_BA = <code>${res.K_BA}</code>, Modified K_BC = <code>${res.K_BC}</code> | DF_BA = <code>${res.DF_BA}</code>, DF_BC = <code>${res.DF_BC}</code></p>
      <div class="eng-table-wrapper">
        <table class="eng-table">
          <thead>
            <tr>
              <th>Operation / Step</th>
              <th>Joint A (M_AB)</th>
              <th>Joint B (M_BA)</th>
              <th>Joint B (M_BC)</th>
              <th>Joint C (M_CB)</th>
            </tr>
          </thead>
          <tbody>
            ${res.rows.map(r => `
              <tr class="${r.isFinal ? 'sum-row' : ''}">
                <td style="text-align:left; font-weight:${r.isFinal ? 'bold' : 'normal'}">${r.step}</td>
                <td>${r.AB}</td>
                <td>${r.BA}</td>
                <td>${r.BC}</td>
                <td>${r.CB}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <p style="color:var(--accent); font-weight:bold; margin-top:8px;">âœ… Joint B is balanced: Î£M_B = (${res.rows[res.rows.length-1].BA}) + (${res.rows[res.rows.length-1].BC}) = 0.00 kNÂ·m!</p>
    </div>
  `;
}

function runConjugateTransform() {
  const key = document.getElementById('conjSelect').value;

}
